name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Create virtual environment and install dependencies
      run: |
        uv venv
        uv pip install -e ".[dev]"

    - name: Run Black (code formatting check)
      run: |
        uv run black --check mw75_streamer/

    - name: Run Flake8 (linting)
      run: |
        uv run flake8 mw75_streamer/ --exclude=__pycache__

    - name: Run MyPy (type checking)
      run: |
        uv run mypy mw75_streamer/ --ignore-missing-imports --disable-error-code=unreachable

    - name: Test package imports on Linux (real-device support enabled)
      run: |
        uv run python -c "
        import sys
        print(f'Testing imports on platform: {sys.platform}')

        import mw75_streamer
        print('Basic import test passed')

        # Cross-platform modules
        import mw75_streamer.main
        import mw75_streamer.data
        import mw75_streamer.testing
        import mw75_streamer.utils
        import mw75_streamer.panel
        import mw75_streamer.server
        print('Cross-platform module imports passed')

        print(f'MW75Device: {mw75_streamer.MW75Device}')
        print(f'BLEManager: {mw75_streamer.BLEManager}')
        print(f'RFCOMMManager (macOS-only): {mw75_streamer.RFCOMMManager}')

        # Linux is a supported real-device platform: the coordinator and BLE
        # manager must be importable, and the Linux RFCOMM backend must be
        # selectable without importing the macOS PyObjC stack.
        if sys.platform == 'linux':
            assert mw75_streamer.MW75Device is not None, 'MW75Device should be available on Linux'
            assert mw75_streamer.BLEManager is not None, 'BLEManager should be available on Linux'
            assert mw75_streamer.RFCOMMManager is None, 'macOS RFCOMMManager should be None on Linux'

            from mw75_streamer.device.rfcomm_backend import create_rfcomm_manager
            from mw75_streamer.device.rfcomm_manager_linux import LinuxRFCOMMManager
            mgr = create_rfcomm_manager('MW75', lambda data: None)
            assert isinstance(mgr, LinuxRFCOMMManager), 'factory must return LinuxRFCOMMManager on Linux'

            for mod in ('objc', 'Foundation', 'IOBluetooth'):
                assert mod not in sys.modules, f'{mod} must not be imported on Linux'
            print('Linux real-device support verified (no PyObjC imported)')
        "

    - name: Test CLI entry points on Linux
      run: |
        uv run mw75-streamer --help
        uv run mw75-test-server --help
        uv run python -m mw75_streamer.server --help

  macos-compatibility:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Install dependencies and test macOS-specific functionality
      run: |
        uv venv
        uv pip install -e ".[dev]"
        uv run python -c "
        import sys
        print(f'Testing imports on platform: {sys.platform}')
        
        import mw75_streamer
        print('✓ Basic import test passed')
        
        # Test that device classes are available on macOS
        print(f'MW75Device: {mw75_streamer.MW75Device}')
        print(f'BLEManager: {mw75_streamer.BLEManager}')  
        print(f'RFCOMMManager: {mw75_streamer.RFCOMMManager}')
        
        if sys.platform == 'darwin':
            assert mw75_streamer.MW75Device is not None, 'MW75Device should be available on macOS'
            assert mw75_streamer.BLEManager is not None, 'BLEManager should be available on macOS'
            assert mw75_streamer.RFCOMMManager is not None, 'RFCOMMManager should be available on macOS'
            print('✓ Device classes properly available on macOS')
            
            # Test direct imports work
            import mw75_streamer.device.ble_manager
            import mw75_streamer.device.rfcomm_manager
            import mw75_streamer.device.mw75_device
            print('✓ Direct macOS device imports successful')
        "

    - name: Test CLI entry points
      run: |
        uv run mw75-streamer --help
        uv run mw75-test-server --help
        uv run python -m mw75_streamer.server --help

  windows-compatibility:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Install dependencies and verify Windows real-device wiring
      run: |
        uv venv
        uv pip install -e ".[dev]"
        uv run python -c "
        import sys
        print(f'Testing imports on platform: {sys.platform}')

        import mw75_streamer
        print('Basic import test passed')

        print(f'MW75Device: {mw75_streamer.MW75Device}')
        print(f'BLEManager: {mw75_streamer.BLEManager}')
        print(f'RFCOMMManager (macOS-only): {mw75_streamer.RFCOMMManager}')

        # Windows is a supported real-device platform: MW75Device/BLEManager must
        # be importable, the factory must select the Windows RFCOMM backend, and
        # neither the macOS (PyObjC) nor Linux (dbus_fast) stacks may be imported.
        if sys.platform == 'win32':
            assert mw75_streamer.MW75Device is not None, 'MW75Device should be available on Windows'
            assert mw75_streamer.BLEManager is not None, 'BLEManager should be available on Windows'
            assert mw75_streamer.RFCOMMManager is None, 'macOS RFCOMMManager should be None on Windows'

            from mw75_streamer.device.rfcomm_backend import create_rfcomm_manager
            from mw75_streamer.device.rfcomm_manager_windows import WindowsRFCOMMManager
            mgr = create_rfcomm_manager('MW75', lambda data: None)
            assert isinstance(mgr, WindowsRFCOMMManager), 'factory must return WindowsRFCOMMManager on Windows'

            # Address normalisation is a pure function; verify it parenthesises.
            assert mgr._to_bth_address('AA:BB:CC:DD:EE:FF') == '(AA:BB:CC:DD:EE:FF)'
            assert mgr._to_bth_address('(AA:BB:CC:DD:EE:FF)') == '(AA:BB:CC:DD:EE:FF)'

            for mod in ('objc', 'Foundation', 'IOBluetooth', 'dbus_fast'):
                assert mod not in sys.modules, f'{mod} must not be imported on Windows'
            print('Windows real-device support verified (no PyObjC / dbus_fast imported)')
        "

    - name: Test CLI entry points on Windows
      run: |
        uv run mw75-streamer --help
        uv run mw75-test-server --help
        uv run python -m mw75_streamer.server --help

  build-and-publish:
    needs: [code-quality, macos-compatibility, windows-compatibility]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Build package
      run: |
        uv venv
        uv pip install build
        uv run python -m build
    
    - name: Check package
      run: |
        uv pip install twine
        uv run twine check dist/*
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1